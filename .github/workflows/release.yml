name: Publish agent releases

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate and test agents
        run: |
          python3 -m py_compile linux/certm-agent.py linux/certm-agent-update.py linux/certm_agent/*.py scripts/build_release.py
          python3 -m json.tool linux/agent.json.example >/dev/null
          python3 -m json.tool windows/config.example.json >/dev/null
          python3 -m json.tool pfsense/config.example.json >/dev/null
          bash -n linux/install.sh linux/install-zimbra.sh pfsense/install.sh pfsense/certm-haproxy
          python3 -m unittest discover -s tests -v

      - name: Validate Windows PowerShell
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem windows -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error $_ }
            }
          }
          if ($failed) { exit 1 }
          ./tests/Validate-WindowsAgent.ps1

      - name: Build independent platform packages
        run: |
          python3 scripts/build_release.py --output dist
          (cd dist && sha256sum certm-agent-* > SHA256SUMS)

      - name: Publish missing platform releases
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail

          for platform in linux windows pfsense; do
            if [[ "$platform" == "windows" ]]; then
              asset="$(find dist -maxdepth 1 -name "certm-agent-$platform-*.zip" -print -quit)"
              version="${asset##*/certm-agent-$platform-}"
              version="${version%.zip}"
            else
              asset="$(find dist -maxdepth 1 -name "certm-agent-$platform-*.tar.gz" -print -quit)"
              version="${asset##*/certm-agent-$platform-}"
              version="${version%.tar.gz}"
            fi

            if [[ -z "$asset" || -z "$version" ]]; then
              echo "Unable to locate $platform release package."
              exit 1
            fi

            filename="$(basename "$asset")"
            tag="$platform-v$version"
            legacy_tag="v$version"

            if gh release view "$tag" >/dev/null 2>&1; then
              echo "Release $tag already exists."
              continue
            fi
            if gh release view "$legacy_tag" --json assets --jq '.assets[].name' 2>/dev/null |
              grep -Fxq "$filename"
            then
              echo "Legacy release $legacy_tag already contains $filename."
              continue
            fi

            release_dir="dist/release-$platform"
            mkdir -p "$release_dir"
            sha256sum "$asset" |
              sed "s#  .*#  $filename#" > "$release_dir/SHA256SUMS"

            release_args=()
            if [[ "$version" == *-* ]]; then
              release_args+=(--prerelease)
            fi

            display="$(tr '[:lower:]' '[:upper:]' <<< "${platform:0:1}")${platform:1}"
            publish_args=(
              "$tag"
              "$asset"
              "$release_dir/SHA256SUMS"
              --target "$TARGET_SHA"
              --title "CertM $display Agent $version"
              --notes "Validated $display update package for CertM Agent $version."
            )
            gh release create "${publish_args[@]}" "${release_args[@]}"
          done
