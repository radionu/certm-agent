name: Validate agent scripts

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux-agent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python and JSON syntax
        run: |
          python3 -m py_compile linux/certm-agent.py linux/certm-agent-update.py linux/certm_agent/*.py scripts/build_release.py
          python3 -m json.tool linux/agent.json.example >/dev/null
          python3 -m json.tool windows/config.example.json >/dev/null
          bash -n linux/install.sh
          python3 scripts/build_release.py 1.0.0-rc.13 --output "$RUNNER_TEMP/releases"
      - name: Run Linux discovery and safety tests
        run: python3 -m unittest discover -s tests -v

  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse Windows PowerShell scripts
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem windows -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object {
                Write-Error "$($_.Extent.File):$($_.Extent.StartLineNumber): $($_.Message)"
              }
            }
          }
          if ($failed) { exit 1 }
      - name: Validate Windows agent contract
        shell: powershell
        run: .\tests\Validate-WindowsAgent.ps1
