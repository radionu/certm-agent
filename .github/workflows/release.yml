name: Publish agent release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Validate and test agent
        run: |
          python3 -m py_compile linux/certm-agent.py linux/certm-agent-update.py linux/certm_agent/*.py scripts/build_release.py
          python3 -m json.tool linux/agent.json.example >/dev/null
          python3 -m json.tool windows/config.example.json >/dev/null
          bash -n linux/install.sh
          python3 -m unittest discover -s tests -v

      - name: Validate Windows PowerShell
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem windows -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$errors
            )
            if ($errors.Count -gt 0) {
              $failed = $true
              $errors | ForEach-Object { Write-Error $_ }
            }
          }
          if ($failed) { exit 1 }
          ./tests/Validate-WindowsAgent.ps1

      - name: Read version
        id: release
        shell: bash
        run: |
          version="$(python3 - <<'PY'
          import pathlib
          import re

          text = pathlib.Path('linux/certm-agent.py').read_text()
          match = re.search(r'^AGENT_VERSION\s*=\s*["\u0027]([^"\u0027]+)', text, re.M)
          if not match:
              raise SystemExit('Unable to read AGENT_VERSION')
          print(match.group(1))
          PY
          )"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build packages
        run: |
          python3 scripts/build_release.py "${{ steps.release.outputs.version }}" --output dist
          (cd dist && sha256sum certm-agent-* > SHA256SUMS)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
          TAG: ${{ steps.release.outputs.tag }}
          PRERELEASE: ${{ steps.release.outputs.prerelease }}
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; leaving its immutable assets unchanged."
            exit 0
          fi

          release_args=()
          if [[ "$PRERELEASE" == "true" ]]; then
            release_args+=(--prerelease)
          fi

          gh release create "$TAG" \
            dist/certm-agent-linux-$VERSION.tar.gz \
            dist/certm-agent-windows-$VERSION.zip \
            dist/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "CertM Agent $VERSION" \
            --notes "Validated Linux and Windows update packages for CertM Agent $VERSION." \
            "${release_args[@]}"
